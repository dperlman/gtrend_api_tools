api_keys:
  serpapi: "my_serpapi_key"
  serpwow: "my_serpwow_key"
  searchapi: "my_searchapi_key"
  brightdata: "my_brightdata_key"
  scrapingdog: "my_scrapingdog_key"
  decodo: "my_decodo_key"

tor:
  control_password: "controlpass" 
  control_port: 9151
  proxy_port: 9150

api_parameters:
  all:
    max_terms: 5
    default_max_workers: 10

available_apis:
  trendspy:
    class: TrendsPy
    type: free
    async: false
    default_concurrency: 1 # this is not an api so no concurrency is possible
    hourly_limit: 0 # it can return data as fast as you can hit it, which is not very fast at all. If you want to slow it down to avoid rate limits, that's a good idea but it's not covered by this parameter.
    description: Uses trendspy library for Google Trends data

  serpapi:
    class: SerpApi
    type: paid
    async: true
    default_concurrency: 100 # no native concurrency limit but we limit it to 100
    hourly_limit: 0 # 1000 per hour for the lowest tier paid plan.
    description: Uses SerpAPI service with direct HTTP requests

  brightdata:
    class: Brightdata
    type: paid
    async: true
    default_concurrency: 100 # no native concurrency limit but we limit it to 100
    hourly_limit: 0 # unknown
    description: Uses Brightdata service

  scrapingdog:
    class: Scrapingdog
    type: paid
    async: false
    default_concurrency: 5 # limit for free or lite plan. Higher plans have much more.
    hourly_limit: 0 # unknown
    description: Uses Scrapingdog service

  decodo:
    class: Decodo
    type: paid
    async: false
    default_concurrency: 5 # limit for free or lite plan. Higher plans have much more.
    hourly_limit: 0 # unknown
    description: Uses Decodo service

  serpwow:
    class: Serpwow
    type: paid
    async: false
    default_concurrency: 10 # can't find any information on concurrency limits
    hourly_limit: 0 # unknown
    description: Uses SerpWow service

  searchapi:
    class: SearchApi
    type: paid
    async: true
    default_concurrency: 100 # no native concurrency limit but we limit it to 100
    hourly_limit: 0 # unknown
    description: Uses SearchAPI service

  applescript_safari:
    class: ApplescriptSafari
    type: free
    async: false
    default_concurrency: 1 # this is not an api so no concurrency is possible
    hourly_limit: 0 # unknown
    description: Uses Safari and AppleScript to access Google Trends

  dummy_api:
    class: DummyApi
    type: free  
    async: false
    default_concurrency: 10000 # this is entirely internal so no limits are necessary
    hourly_limit: 0 # unknown
    description: Generates dummy data for testing and development

  win_uiauto_edge:
    class: WinUiautoEdge
    type: free
    async: false
    default_concurrency: 1 # this is not an api so no concurrency is possible
    hourly_limit: 0 # unknown
    description: Uses Windows UI Automation to access Google Trends via Edge browser (not implemented) 
    

# I don't think I'm using this part anymore.
# I think we will use a different approach for batch search strategies.
api_modes:
  - name: "trendspy"
    description: "trendspy"
    api_order:
      - trendspy

  - name: "serpapi"
    description: "serpapi"
    api_order:
      - serpapi

  - name: "brightdata"
    description: "brightdata"
    api_order:
      - brightdata

  - name: "serpwow"
    description: "serpwow"
    api_order:
      - serpwow

  - name: "searchapi"
    description: "searchapi"
    api_order:
      - searchapi

  - name: "applescript_safari"
    description: "applescript_safari"
    api_order:
      - applescript_safari

  - name: "dummy"
    description: "dummy data, no api call"
    api_order:
      - dummy_api

  - name: "smart_tpy"
    description: "trendspy:serpapi:serpwow:searchapi"
    api_order:
      - trendspy
      - serpapi
      - serpwow
      - searchapi

  - name: "smart_pyt"
    description: "NOT IMPLEMENTED! pytrends:serpapi:serpwow:searchapi"
    api_order:
      - pytrends
      - serpapi
      - serpwow
      - searchapi

  - name: "smart_sel"
    description: "selenium:serpapi:serpwow:searchapi"
    api_order:
      - selenium
      - serpapi
      - serpwow
      - searchapi
  
  - name: "smart_pay"
    description: "serpapi:serpwow:searchapi"
    api_order:
      - serpapi
      - serpwow
      - searchapi
