[pytest]
# Combined options equivalent to: -vpPsl --capture=no --durations=3
addopts = -v -s -l --capture=no --durations=3

# Test discovery patterns
testpaths = tests

# Python files to consider as test files
python_files = test_*.py *_test.py

# Python classes to consider as test classes
python_classes = Test*

# Python functions to consider as test functions
python_functions = test_*

# Minimum version of pytest required
minversion = 6.0

# Configure test output
console_output_style = classic 